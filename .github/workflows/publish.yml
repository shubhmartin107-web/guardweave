name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to publish to'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  publish:
    name: Publish to ${{ inputs.environment || 'PyPI' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'pypi' }}
      url: ${{ inputs.environment == 'testpypi' && 'https://test.pypi.org/project/guardweave/' || 'https://pypi.org/project/guardweave/' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build
        run: uv pip install --system build

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI
        if: github.event_name == 'release' || inputs.environment == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Publish to TestPyPI
        if: inputs.environment == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
