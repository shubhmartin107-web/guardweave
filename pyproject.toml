[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardweave"
version = "0.1.0"
description = "Safety, Guardrails & Governance Layer for AI Agents — structured safety controls, permission management, auditability, and human oversight"
readme = "README.md"
authors = [
    {name = "GuardWeave Contributors"},
]
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = [
    "ai-safety", "guardrails", "governance", "ai-agents", "policy-engine",
    "human-in-the-loop", "audit", "llm-security", "agent-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Framework :: AsyncIO",
]
dependencies = [
    "gradio>=5.0",
    "fastapi>=0.138.2",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.7",
    "httpx>=0.27",
    "python-dateutil>=2.9",
]

[project.urls]
homepage = "https://guardweave.ai"
repository = "https://github.com/anomalyco/guardweave"
documentation = "https://guardweave.ai/docs"
changelog = "https://github.com/anomalyco/guardweave/releases"
issues = "https://github.com/anomalyco/guardweave/issues"

[project.scripts]
guardweave = "guardweave.cli.app:app"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.4",
    "mypy>=2.1.0",
    "types-PyYAML",
    "types-python-dateutil",
    "bandit>=1.9.4",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.21",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.5",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5",
]
all = [
    "guardweave[dev,test,docs]",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["guardweave*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["guardweave"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # flake8-simplify
    "ARG",     # flake8-unused-arguments
    "PTH",     # flake8-use-pathlib
    "RUF",     # ruff-specific
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B904",    # raise without from exception
    "ARG001",  # unused function arguments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806", "S101", "ARG"]
"src/guardweave/cli/shell.py" = ["ARG002", "N802"]
"src/guardweave/cli/app.py" = ["E402"]
"src/guardweave/engine/evaluator.py" = ["SIM103"]
"src/guardweave/hitl/workflow.py" = ["ARG002"]
"src/guardweave/sdk/plugin.py" = ["ARG002"]
"examples/*" = ["ARG002", "PTH118", "PTH120"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_unimported = false

[[tool.mypy.overrides]]
module = ["guardweave.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B311", "B404", "B603", "B607"]
